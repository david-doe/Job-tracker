name: Lecture des réponses Gmail

on:
  schedule:
    - cron: "17 6-22 * * *"   # toutes les heures de 8 h à minuit (heure de Paris en été)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gmail
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet gspread oauth2client pandas
      - name: Synchroniser
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python sync_cli.py
